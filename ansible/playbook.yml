---
# StatusPulse — Ansible Playbook
# Configures a fresh Ubuntu VM into a complete production setup
# Usage: ansible-playbook -i inventory.ini playbook.yml

- name: Configure StatusPulse Production Server
  hosts: statuspulse
  become: true
  vars_files:
    - vars.yml

  tasks:
    # === SYSTEM UPDATES ===
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - ufw
          - fail2ban
          - unattended-upgrades
          - python3-pip
          - jq
        state: present

    - name: Enable automatic security updates
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        mode: "0644"

    # === DEPLOY USER ===
    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        groups: sudo
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Add SSH authorized key for deploy user
      authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('file', ssh_public_key_path) }}"
        state: present

    # === HARDEN SSH ===
    - name: Harden SSH configuration
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?Port ', line: "Port {{ ssh_port }}" }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
      notify: Restart SSH

    # === FIREWALL ===
    - name: Set UFW default deny incoming
      ufw: { direction: incoming, policy: deny }

    - name: Set UFW default allow outgoing
      ufw: { direction: outgoing, policy: allow }

    - name: Allow SSH port
      ufw: { rule: allow, port: "{{ ssh_port }}", proto: tcp }

    - name: Allow HTTP
      ufw: { rule: allow, port: "80", proto: tcp }

    - name: Allow HTTPS
      ufw: { rule: allow, port: "443", proto: tcp }

    - name: Enable UFW
      ufw: { state: enabled }

    # === SWAP ===
    - name: Check if swap file exists
      stat: { path: /swapfile }
      register: swap_file

    - name: Create swap file
      command: fallocate -l {{ swap_size }} /swapfile
      when: not swap_file.stat.exists

    - name: Set swap permissions
      file: { path: /swapfile, mode: "0600" }
      when: not swap_file.stat.exists

    - name: Make swap
      command: mkswap /swapfile
      when: not swap_file.stat.exists

    - name: Enable swap
      command: swapon /swapfile
      when: not swap_file.stat.exists

    - name: Add swap to fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    # === DOCKER ===
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: yes

    - name: Add deploy user to docker group
      user: { name: "{{ deploy_user }}", groups: docker, append: yes }

    - name: Enable and start Docker
      systemd: { name: docker, enabled: yes, state: started }

    # === DEPLOY APP ===
    - name: Create project directory
      file:
        path: "/home/{{ deploy_user }}/statuspulse"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"

    - name: Copy scripts
      copy:
        src: "../scripts/{{ item }}"
        dest: "/home/{{ deploy_user }}/statuspulse/scripts/{{ item }}"
        owner: "{{ deploy_user }}"
        mode: "0755"
      loop: [deploy.sh, backup.sh, health-monitor.sh]

    # === CRON JOBS ===
    - name: Health monitor cron (every 5 min)
      cron:
        name: "StatusPulse health monitor"
        minute: "*/5"
        job: "/home/{{ deploy_user }}/statuspulse/scripts/health-monitor.sh"
        user: "{{ deploy_user }}"

    - name: Daily backup cron (2 AM)
      cron:
        name: "StatusPulse database backup"
        hour: "2"
        minute: "0"
        job: "/home/{{ deploy_user }}/statuspulse/scripts/backup.sh"
        user: "{{ deploy_user }}"

    # === LOG FILES ===
    - name: Create log files
      file:
        path: "{{ item }}"
        state: touch
        owner: "{{ deploy_user }}"
        mode: "0644"
      loop:
        - /var/log/statuspulse-monitor.log
        - /var/log/statuspulse-deploy.log
        - /var/log/statuspulse-backup.log

  handlers:
    - name: Restart SSH
      systemd: { name: sshd, state: restarted }
