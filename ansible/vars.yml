# =============================================================================
# StatusPulse — Ansible Variables
# =============================================================================

---
# Deploy user
deploy_user: deploy

# SSH
ssh_port: 22
ssh_public_key_path: ~/.ssh/id_rsa.pub

# Swap
swap_size: 2G

# Application
domain: statuspulsebhanu.duckdns.org
app_port: 8000

# Database
db_name: statuspulse
db_user: postgres
db_password: "{{ vault_db_password | default('change_me_in_vault') }}"

# Redis
redis_password: "{{ vault_redis_password | default('change_me_in_vault') }}"

# Monitoring
alert_webhook_url: ""
